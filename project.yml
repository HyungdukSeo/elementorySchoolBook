name: ElementarySchoolBook
options:
  bundleIdPrefix: com.hdseo
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Debug
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"   # iPad only
    SUPPORTS_MAC_DESIGNED_FOR_IPAD: "NO"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ElementarySchoolBook:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ElementarySchoolBook
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hdseo.ElementarySchoolBook
        INFOPLIST_FILE: ElementarySchoolBook/Info.plist
        DEVELOPMENT_TEAM: ""
    info:
      path: ElementarySchoolBook/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
